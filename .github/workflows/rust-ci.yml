name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain and components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        run: cargo +stable fmt --check

      - name: Lint
        run: cargo +stable clippy --all-targets -- -D warnings

      - name: Test
        run: cargo +stable test --locked

  action:
    name: Action wrapper build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actions/cai
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: actions/cai/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build wrapper
        run: npm run build

      - name: Require checked-in action bundle
        run: git diff --exit-code -- dist

      - name: Test wrapper
        run: npm test
