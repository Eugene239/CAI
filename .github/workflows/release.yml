name: Release CAI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-linux-x86-64:
    name: Release Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Build release binary
        run: cargo +stable build --locked --release -p cai

      - name: Package binary and checksum
        run: |
          asset="cai-x86_64-unknown-linux-gnu.tar.gz"
          tar -C target/release -czf "$asset" cai
          sha256sum "$asset" > "$asset.sha256"

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "cai-x86_64-unknown-linux-gnu.tar.gz" \
            "cai-x86_64-unknown-linux-gnu.tar.gz.sha256" \
            --title "CAI $TAG" \
            --generate-notes
